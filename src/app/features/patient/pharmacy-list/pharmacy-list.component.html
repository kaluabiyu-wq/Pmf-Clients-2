<section class="pharmacy-list-page">
 

  <div class="search-bar">
     <input
      type="search"
      class="search-input"
      placeholder="Search pharmacy name…"
      [(ngModel)]="searchTerm"
      (keyup.enter)="onSearch()"
    />
    @if (searchTerm()) {
      <button type="button" class="clear-btn" (click)="onClear()" aria-label="Clear search">✕</button>
    }
  </div>
  <div class="toolbar" matSort (matSortChange)="onSortChange($event)">
    <span class="sort-label">Sort by:</span>
    <button type="button" mat-sort-header="Name">Name</button>
    <button type="button" mat-sort-header="ReliabilityScore">Reliability</button>

  </div>

  @if (isLoading()) {
    <div class="spinner">Loading pharmacies…</div>
  }

  @if (loadError()) {
    <p class="error-banner">{{ loadError() }}</p>
  }

  @if (!isLoading() && !loadError()) {
    @if (pharmacies().length === 0) {
      <div class="empty-state">
        <p>No pharmacies found.</p>
      </div>
    }

    <div class="grid">
      @for (item of pharmacies(); track item.id) {
        <app-pharmacy-list-card [pharmacy]="item" (viewDetails)="onViewDetails($event)" />
      }
    </div>
    <mat-paginator
      [length]="totalCount()"
      [pageIndex]="pageIndex"
      [pageSize]="pageSize"
      [pageSizeOptions]="[10, 20, 50]"
      showFirstLastButtons
      (page)="onPageChange($event)">
    </mat-paginator>
  }
</section>
