<nav class="navbar">
  <div class="nav-list">
    @for (item of navItems(); track item.path) {
      <button
        type="button"
        class="nav-btn"
        [routerLink]="item.path"
        routerLinkActive="is-active"
      >
        {{ item.label }}
      </button>
    }

    <span class="nav-spacer"></span>

    @if (auth.isAuthenticated()) {
      <span class="nav-user">{{ auth.currentUser()?.email }} · {{ auth.role() }}</span>
      <button type="button" class="nav-btn" (click)="logout()">Log out</button>
    } @else {
      <button type="button" class="nav-btn" routerLink="/login" routerLinkActive="is-active">
        Log in
      </button>
      <button type="button" class="nav-btn" routerLink="/signup/patient" routerLinkActive="is-active">
        Patient sign up
      </button>
      <button type="button" class="nav-btn" routerLink="/signup/pharmacy" routerLinkActive="is-active">
        Pharmacy sign up
      </button>
    }
  </div>
</nav>

<router-outlet />
